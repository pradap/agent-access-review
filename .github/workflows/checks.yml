name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and scanner integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_examples.py
      - name: Show example reviews
        run: |
          cat output/expanded.md >> "$GITHUB_STEP_SUMMARY"
          cat output/fixed.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-reviews
          path: output/*.md
          retention-days: 14

  access-review:
    name: Agent access review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The reviewer and policy come from the PR base, never from proposed code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read configurations as data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          mkdir -p output
          for side in before after; do
            if [ "$side" = before ]; then revision="$BASE_SHA"; else revision="$HEAD_SHA"; fi
            if git cat-file -e "$revision:.mcp.json" 2>/dev/null; then
              git show "$revision:.mcp.json" > "output/$side.json"
            else
              echo '{"mcpServers":{}}' > "output/$side.json"
            fi
          done
      - name: Evaluate changes
        id: review
        continue-on-error: true
        run: >-
          python3 -m agent_access_review output/before.json output/after.json
          --policy .agent-review/policy.json
          --scanner node_modules/.bin/mcp-audit --output output/review.md
      - name: Publish review summary
        if: ${{ !cancelled() && steps.review.outcome != 'skipped' && steps.review.outcome != '' }}
        run: |
          if [ -f output/review.md ]; then
            cat output/review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Review failed before a report could be produced. Check the error above.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.review.outcome != 'skipped' && steps.review.outcome != '' }}
        with:
          name: access-review
          path: output/review.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Require review or correction
        if: steps.review.outcome == 'failure'
        run: |
          echo 'Configuration needs review, or evaluation failed. This check does not verify approval or allow automatic exceptions.'
          exit 1
